name: RoutBuddy CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Backend Build & Test
  backend-test:
    name: Build & Test Spring Boot Modular Monolith
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn clean verify -B
        working-directory: ./backend

  # 2. AI Service Test
  ai-service-test:
    name: Test FastAPI AI Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: ./ai-service
      - name: Run PyTest
        run: pytest
        working-directory: ./ai-service

  # 3. Frontend Admin Build
  frontend-admin-build:
    name: Build Next.js Admin Portal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend-admin/package.json
      - name: Install & Build
        run: |
          npm ci
          npm run build
        working-directory: ./frontend-admin

  # 4. Flutter Client Analysis
  flutter-test:
    name: Flutter Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
      - name: Passenger App Checks
        run: |
          flutter pub get
          flutter analyze
        working-directory: ./mobile/routbuddy_passenger
      - name: Driver App Checks
        run: |
          flutter pub get
          flutter analyze
        working-directory: ./mobile/routbuddy_driver
