server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: routbuddy-platform-local

  datasource:
    url: jdbc:h2:file:./data/routbuddy_local;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

routbuddy:
  jwt:
    secret: routbuddy_very_secure_jwt_secret_key_that_is_at_least_256_bits_long_2026
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
