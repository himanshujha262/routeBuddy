name: routbuddy_driver
description: RoutBuddy Driver App for Shared Auto drivers, route dispatching, passenger QR scanning, and live telemetry
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  dio: ^5.5.0
  stomp_dart_client: ^1.0.1
  mobile_scanner: ^5.1.1
  geolocator: ^12.0.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
